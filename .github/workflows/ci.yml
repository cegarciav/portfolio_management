name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # latest at the moment of writing, uses the version in .ruby-version
        with:
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec rspec
