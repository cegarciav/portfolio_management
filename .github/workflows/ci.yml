name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1 # uses the version in .ruby-version
        with:
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec rspec
